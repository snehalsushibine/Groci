<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Groci – Shop smarter. Just speak.</title>
  <meta name="description"
    content="Shop smarter with your voice. Groci uses browser-native speech recognition to manage your grocery shopping list hands-free." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('groci_preferences');
        var theme = 'system';
        if (stored) {
          var parsed = JSON.parse(stored);
          theme = parsed.theme || 'system';
        }
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { }
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
